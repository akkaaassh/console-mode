[package]
name = "console-mode"
version = "0.4.0"
description = "A console-style launcher for Windows, driven by a controller"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cm-native = { path = "../native" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
