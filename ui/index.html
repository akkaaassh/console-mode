<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a living-room console, calm and cinematic
   IDEA: the page is the TV itself, a 16:9 console screen scaled to the window
   PICTURE: full-bleed game art behind a row of tiles
   COLOUR and TYPE: near-black #05070d, white, one blue #5B9BFF; Space Grotesk titles, Inter UI
   LAYOUT: one 1280x720 stage, letterboxed and scaled to fit */
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#000;color:#eef2fb;font:15px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;background:#05070d;transform-origin:center}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
.h{font-family:'Space Grotesk',Inter,sans-serif}
.scr{position:absolute;inset:0}
.enter{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:scale(1.01)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}}
.btn{height:44px;padding:0 20px;border-radius:22px;background:rgba(255,255,255,.12);font-weight:600}
.btn.pri{background:#fff;color:#05070d}
.ic{width:42px;height:42px;border-radius:21px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08)}
.foc{outline:3px solid #fff;outline-offset:3px}
.hov{box-shadow:0 0 0 3px #5B9BFF!important}
.hint{display:flex;gap:18px;font-size:13px;color:#a9b4cc;flex-wrap:wrap;align-items:center}
.hint b{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;border:1.5px solid #a9b4cc;color:#eef2fb;font-size:11px;margin-right:6px}
.muted{color:#a9b4cc}
/* login */
.login{background:radial-gradient(70% 90% at 25% 30%,#3a5a8a 0%,transparent 60%),radial-gradient(60% 80% at 85% 80%,#2a3f5f 0%,transparent 60%),#0f1a2c}
.av{border-radius:50%;background:#5B9BFF;color:#06101f;display:flex;align-items:center;justify-content:center;font-weight:700}
.pinbox{width:300px;height:46px;border-radius:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;gap:12px}
.dot{width:12px;height:12px;border-radius:6px;border:2px solid rgba(255,255,255,.45)}.dot.on{background:#fff;border-color:#fff}
.pad{position:absolute;right:120px;top:110px;width:400px;padding:24px;border-radius:20px;background:rgba(8,14,26,.8);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:16px}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pk{height:64px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);font:600 24px 'Space Grotesk',sans-serif;position:relative}
.pk span,.ok span{position:absolute;right:8px;bottom:6px;font:600 11px Inter,sans-serif;color:#9fb0cf}
.pk.flash{background:#fff;color:#05070d}
/* home */
.tiles{position:absolute;left:48px;top:84px;display:flex;gap:12px;align-items:flex-start}
.tile{flex:none;width:84px;height:84px;border-radius:12px;position:relative;transition:width .18s,height .18s}
.tile.on{width:120px;height:120px;outline:3px solid #fff;outline-offset:3px;box-shadow:0 14px 36px rgba(0,0,0,.6)}
.tile em{position:absolute;left:6px;bottom:6px;font:600 10px Inter;font-style:normal;background:#3FE08A;color:#05070d;padding:2px 6px;border-radius:8px}
.card{flex:1;height:96px;border-radius:14px;background:rgba(255,255,255,.09);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.card small{font-size:12px;color:rgba(255,255,255,.6)}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.2)}.bar i{display:block;height:4px;border-radius:2px;background:#fff}
/* library */
.tabs{display:flex;gap:8px}
.tab{height:38px;padding:0 18px;border-radius:19px;font-size:14px;font-weight:600;color:#a9b4cc}.tab.on{background:#fff;color:#070b16}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:16px}
.cover{position:relative;aspect-ratio:3/4;border-radius:12px;padding:8px;display:flex;align-items:flex-start;width:100%}
.cover span{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.45)}
.gi{display:flex;flex-direction:column;gap:8px;text-align:left}.gi p{margin:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi.on .cover{outline:3px solid #fff;outline-offset:3px}
/* quick menu */
#qm{position:absolute;inset:0;z-index:20;display:none}
.qa{height:58px;border-radius:29px;padding:0 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);text-align:center;white-space:nowrap;overflow:hidden}
#gal,#ctl{position:absolute;inset:0;z-index:28;display:none}
.gimg{border-radius:10px;border:2px solid transparent;width:100%}
.gimg.sf{outline:3px solid #fff;outline-offset:3px}
.gimg.cur{border-color:#3FE08A}
.tile.add{background:rgba(255,255,255,.08)!important;border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font:300 34px Inter,sans-serif;color:#fff}
.tile .tic{position:absolute;inset:18%;width:64%;height:64%;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.qa.on{background:#fff;color:#070b16;border-color:#fff}
.mb{width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
.mb.big{width:52px;height:52px;border-radius:26px;background:#fff;color:#05070d}
.mb.spot{width:48px;height:48px;border-radius:24px;background:#1ed760;color:#05070d}
.mb.on{outline:3px solid #fff;outline-offset:3px}
/* desktop */
#desk{position:absolute;inset:0;display:none;background:linear-gradient(135deg,#1c3557 0%,#0f1a2c 70%)}
.win{position:absolute;left:160px;top:40px;width:960px;height:360px;border-radius:10px;background:#f3f4f7;color:#1a1d24;box-shadow:0 20px 50px rgba(0,0,0,.45);overflow:hidden}
.win input,.win textarea{width:100%;font:16px Inter,sans-serif;border:2px solid #c9ced8;border-radius:8px;padding:10px 12px;background:#fff;color:#1a1d24;outline:none}
.win input:focus,.win textarea:focus,.win .tgt{border-color:#2f6fe0}
.task{position:absolute;left:0;right:0;bottom:0;height:52px;background:rgba(8,12,22,.9);display:flex;align-items:center;gap:12px;padding:0 16px}
/* osk */
#osk{position:absolute;left:0;right:0;bottom:0;z-index:40;display:none;padding:12px 80px 10px;background:rgba(8,12,22,.97);border-top:1px solid rgba(255,255,255,.1);flex-direction:column;gap:7px}
.krow{display:flex;gap:7px}
.k{position:relative;flex:1 1 0;height:44px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);font-size:19px}
.k.sp{background:rgba(255,255,255,.14);font-size:14px;font-weight:600}
.k.on{background:#fff;color:#05070d;box-shadow:0 0 0 3px #5B9BFF}
.k.lit{background:#5B9BFF;color:#05070d}
.k span{position:absolute;right:6px;bottom:3px;font-size:10px;font-weight:600;color:#8fa0c0}
.preview{height:32px;display:flex;align-items:center;gap:10px;font-size:15px}
.preview code{font:15px Inter,sans-serif;white-space:pre;overflow:hidden;background:rgba(255,255,255,.06);padding:4px 10px;border-radius:6px;flex:1}
.caret{display:inline-block;width:2px;height:18px;background:#5B9BFF;vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* settings */
.side{width:300px;padding:40px 24px;background:#0b0f19;display:flex;flex-direction:column;gap:4px}
.side a{padding:12px;border-radius:10px;color:rgba(255,255,255,.7);text-decoration:none;font-size:15px}.side a.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.mrow{height:72px;border-radius:14px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.06);border:2px solid transparent}
.mrow.on{background:rgba(91,155,255,.22);border-color:#5B9BFF}
.mrow b{font:700 26px 'Space Grotesk',sans-serif}.mrow span{font-size:14px;font-weight:600;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.12)}
.seg{display:flex;gap:6px;padding:4px;border-radius:22px;background:rgba(255,255,255,.06);width:max-content}
.sb{height:38px;padding:0 16px;border-radius:19px;font-size:14px;font-weight:600;color:#a9b4cc}.sb.on{background:#fff;color:#05070d}
.sf{outline:3px solid #5B9BFF!important;outline-offset:2px}
.sw{width:56px;height:32px;border-radius:16px;background:rgba(255,255,255,.2);position:relative;flex:none}.sw.on{background:#3FE08A}.sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .15s}.sw.on i{left:28px}
.gl{font-size:13px;color:#a9b4cc;margin-bottom:8px}
.stat{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.05)}
.side button{padding:12px;border-radius:10px;color:rgba(255,255,255,.7);font-size:15px;text-align:left}.side button.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
/* chrome */
#bg{position:absolute;inset:0;transition:background .5s}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#opt{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
.fld{width:520px;height:46px;border-radius:10px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font:16px Inter,sans-serif;padding:0 14px;outline:none}.fld:focus,.fld.tgt{border-color:#5B9BFF}
#conn{position:absolute;inset:0;z-index:25;display:none}
.kf{outline:3px solid #fff!important;outline-offset:3px}
.tile.sel{width:120px;height:120px;outline:2px solid rgba(255,255,255,.5);outline-offset:3px}
.tname{position:absolute;top:220px;font-size:17px;font-weight:600;transition:left .18s ease;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.logo{max-width:560px;max-height:190px;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 6px 24px rgba(0,0,0,.65))}
.hn{font-size:19px;padding:4px 6px;border-radius:8px}
.pill{height:64px;border-radius:32px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px;padding:0 22px 0 10px;max-width:380px;min-width:0;backdrop-filter:blur(14px)}
.pi{width:44px;height:44px;border-radius:22px;flex:none;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.pt{display:flex;flex-direction:column;min-width:0;text-align:left}.pt small{font-size:11px;color:rgba(255,255,255,.65)}.pt b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:3px;align-items:flex-end;height:28px;margin-left:4px}.mini i{width:6px;background:#5B9BFF;border-radius:2px;min-height:2px;transition:height .4s}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.05);text-align:left;width:100%}
.bars{display:flex;gap:2px;align-items:flex-end;height:21px;width:22px}.bars i{width:4px;background:#fff;border-radius:1px}
.nomouse,.nomouse *{cursor:none!important}
#cur{position:absolute;left:0;top:0;pointer-events:none;z-index:50;opacity:0;transition:opacity .3s}
#toast{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:60;background:rgba(20,26,40,.97);border:1px solid rgba(255,255,255,.15);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#help{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
#help .box{width:640px;padding:28px 32px;border-radius:18px;background:#0e1424;border:1px solid rgba(255,255,255,.12)}
#help table{width:100%;border-collapse:collapse;font-size:14px}#help td{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}#help td:last-child{text-align:right;color:#a9b4cc}
#chip{position:fixed;left:12px;bottom:12px;z-index:100;display:flex;gap:10px;align-items:center;padding:8px 14px;border-radius:18px;background:rgba(20,26,40,.92);border:1px solid rgba(255,255,255,.12);font-size:13px}
#chip i{width:8px;height:8px;border-radius:4px;background:#ff8a3d}#chip i.ok{background:#3FE08A}
#chip button{height:28px;padding:0 10px;border-radius:14px;background:rgba(255,255,255,.12);font-size:12px;font-weight:600}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="bg"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="scr" class="scr"></div>
  <div id="desk">
    <div class="win">
      <div style="height:36px;background:#e2e5eb;display:flex;align-items:center;padding:0 14px;font-size:13px;color:#4a5061">Sample app · any Windows program with text fields</div>
      <div style="padding:26px 60px;display:flex;flex-direction:column;gap:10px">
        <label for="dsearch" style="font-size:14px;font-weight:600">Search</label>
        <input id="dsearch" autocomplete="off" placeholder="Search games, music, the web…">
        <label for="dnotes" style="font-size:14px;font-weight:600;margin-top:6px">Notes</label>
        <textarea id="dnotes" rows="3" placeholder="Write something…"></textarea>
        <p style="margin:2px 0 0;font-size:13px;color:#6a7080">Point the controller cursor at a field and press A: the keyboard opens. Clicking with a real mouse and typing on a real keyboard keeps it closed.</p>
      </div>
    </div>
    <div class="task">
      <button class="btn pri" data-act="go:home">Console home</button>
      <span class="hint" style="margin-left:12px"><span><b>RS</b>Cursor</span><span><b>A</b>Click</span><span><b>G</b>Quick menu</span></span>
      <span class="clk h" style="margin-left:auto;font-size:18px;font-weight:600"></span>
    </div>
  </div>
  <div id="osk"></div>
  <div id="qm"></div>
  <div id="conn"></div>
  <div id="gal"></div>
  <div id="ctl"></div>
  <div id="opt"></div>
  <div id="toast"></div>
  <div id="help"></div>
  <div id="cur"><svg width="26" height="30" viewBox="0 0 26 30" aria-hidden="true"><path d="M2 2 L2 24 L8 18 L12 28 L16 26 L12 17 L21 17 Z" fill="#fff" stroke="#05070d" stroke-width="2" stroke-linejoin="round"/></svg></div>
</div></div>
<div id="chip"><i></i><span id="chipt">No controller yet · press any button on it</span><button data-act="help">Keys (H)</button></div>

<script>
{
const $=s=>document.querySelector(s);
const NATIVE=!!(window.__TAURI__&&window.__TAURI__.core);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stage=$('#stage');

const GAMES=[
 {t:'Assassin’s Creed IV Black Flag',s:'Steam',last:'Yesterday',h:41,gb:46,c1:'#0e4c6e',c2:'#d9a441',tags:['fav']},

const sortBy=(list,m)=>[...list].sort(m==='name'?(a,b)=>a.t.localeCompare(b.t):m==='installed'?(a,b)=>(b.inst||'').localeCompare(a.inst||''):(a,b)=>a.lp-b.lp);
const DEFPREF={leftStick:'scroll',homeScreen:true,steamArt:true,sgdbKey:'',sortGames:'recent',sortApps:'recent',bright:100,cursor:100,leftMouse:true,particles:true,showHidden:false,spClient:'',power:'balanced',res:'1920×1080',hz:'144',startup:true,pinpad:true};
let PREF={...DEFPREF};
try{Object.assign(PREF,JSON.parse(localStorage.getItem('cm-pref')||'{}'))}catch(e){}

const BTN=['A','B','X','Y','LB','RB','LT','RT','View','Menu','L3','R3','Up','Down','Left','Right','Guide'];
let held={},rep={},chord=false,lastT=0;
function poll(t){if(NATIVE)return;
 const dt=Math.min(50,t-(lastT||t))/1000;lastT=t;
 const pads=navigator.getGamepads?navigator.getGamepads():[];let gp=null;
 for(const p of pads)if(p&&p.connected){gp=p;break}
 if(gp){
  if(S.pad!==gp.id){S.pad=gp.id;chip();if(S.screen==='login'||S.screen==='home')render()}
  const now={};BTN.forEach((b,i)=>{const x=gp.buttons[i];now[b]=!!x&&(x.pressed||x.value>.5)});
  const lx=gp.axes[0]||0,ly=gp.axes[1]||0,rx=gp.axes[2]||0,ry=gp.axes[3]||0;
  const leftIsMouse=S.screen==='desktop'&&!S.osk.open&&!S.qm.open;
  if(!leftIsMouse){if(lx<-.55)now.Left=true;if(lx>.55)now.Right=true;if(ly<-.55)now.Up=true;if(ly>.55)now.Down=true}
  const stick=(x,y)=>{const m=Math.hypot(x,y);if(m<.18)return;const k=(m-.18)/(.82)*1100*dt*((m-.18)/.82+.3);moveCursor(x/m*k,y/m*k)};
  stick(rx,ry);if(leftIsMouse)stick(lx,ly);
  if(now.View&&now.Menu&&!chord){chord=true;handle('Guide')}
  for(const b of BTN){
   const p=now[b],w=held[b];
   if(b==='View'||b==='Menu'){if(!p&&w&&!chord)handle(b)}
   else if(p&&!w){handle(b);rep[b]=t+380}
   else if(p&&w&&DIRS.has(b)&&t>=rep[b]){handle(b);rep[b]=t+110}
  }
  if(!now.View&&!now.Menu)chord=false;
  held=now;
 }else if(S.pad){S.pad='';chip()}
 requestAnimationFrame(poll);
}

/* ---- Spotify account (for the up-next queue) ---- */
const SP_PORT=43821,SP_REDIRECT=`http://127.0.0.1:${SP_PORT}/callback`;
let SPT=store('cm-spotify',{});
const spConnected=()=>!!SPT.refresh;
function rnd(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,b=>('0'+b.toString(16)).slice(-2)).join('')}
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function spConnect(){
 const id=(PREF.spClient||'').trim();
 if(!id){toast('Add your Spotify Client ID first');return}
 const verifier=rnd(48),state=rnd(12);
 const challenge=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
 S.spPending={verifier,state};
 await invoke('spotify_listen',{port:SP_PORT});
 const q=new URLSearchParams({client_id:id,response_type:'code',redirect_uri:SP_REDIRECT,code_challenge_method:'S256',code_challenge:challenge,state,scope:SP_SCOPES});
 if(await invoke('open_url',{url:'https://accounts.spotify.com/authorize?'+q}))toast('Sign in to Spotify in your browser, then come back');else toast('Couldn’t open the browser');
}
function spSave(j){SPT={access:j.access_token,refresh:j.refresh_token||SPT.refresh,scope:j.scope||SPT.scope||'',exp:Date.now()+((j.expires_in||3600)-60)*1000};keep('cm-spotify',SPT);if(S.sp)S.sp.lib=null}
async function spFinish(p){
 if(!S.spPending||p.state!==S.spPending.state){toast('That Spotify sign-in didn’t match. Try again.');return}
 if(!p.code){toast('Spotify sign-in was cancelled');return}
 try{
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'authorization_code',code:p.code,redirect_uri:SP_REDIRECT,client_id:PREF.spClient.trim(),code_verifier:S.spPending.verifier})});
  const j=await r.json();
  if(!r.ok){toast('Spotify said: '+(j.error_description||j.error||r.status));return}
  spSave(j);S.spPending=null;toast('Spotify connected');render();
 }catch(e){toast('Couldn’t reach Spotify. Check your internet connection.')}
}
async function spToken(){
 if(!SPT.refresh)return null;if(SPT.access&&Date.now()<SPT.exp)return SPT.access;
 try{const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:SPT.refresh,client_id:(PREF.spClient||'').trim()})});
  const j=await r.json();if(!r.ok){if(j.error==='invalid_grant'){SPT={};keep('cm-spotify',SPT)}return null}spSave(j);return SPT.access}catch(e){return null}
}
let qT=0;
async function pollQueue(){
 if(!NATIVE||!spConnected()||Date.now()-qT<4000)return;qT=Date.now();
 const t=await spToken();if(!t){S.queueErr='Spotify sign-in expired. Reconnect it in Settings › Music.';renderQM();return}
 try{const r=await fetch('https://api.spotify.com/v1/me/player/queue',{headers:{Authorization:'Bearer '+t}});
  if(r.status===401){SPT.exp=0;return}
  if(r.status===204||!r.ok){S.queue=[];S.queueErr=r.ok?'Nothing playing on Spotify.':'Spotify didn’t share the queue ('+r.status+').';renderQM();return}
  const j=await r.json();S.queueErr='';
  S.queue=(j.queue||[]).slice(0,5).map(x=>{const imgs=(x.album&&x.album.images)||x.images||[];const im=imgs[imgs.length-1]||imgs[0];return{t:x.name||'',a:(x.artists||[]).map(a=>a.name).join(', ')||(x.show&&x.show.name)||'',len:Math.round((x.duration_ms||0)/1000),img:im?im.url:null,bg:'rgba(255,255,255,.08)'}});
  renderQM();
 }catch(e){S.queueErr='Couldn’t reach Spotify.';renderQM()}
}

/* ---- moving particles behind the console ---- */
const FX={on:false,parts:[],raf:0,last:0,tint:[120,170,255]};
const fx=$('#fx'),fxc=fx.getContext('2d');
function fxSize(){if(!fxc)return;const r=stage.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);fx.width=Math.round(r.width*d);fx.height=Math.round(r.height*d);fxc.setTransform(fx.width/1280,0,0,fx.height/720,0,0)}
function fxSeed(){FX.parts=[];for(let i=0;i<90;i++){const big=i<10;FX.parts.push({x:Math.random()*1280,y:Math.random()*720,r:big?14+Math.random()*26:0.6+Math.random()*2.4,vx:4+Math.random()*10,vy:-(3+Math.random()*9),ph:Math.random()*6.28,sp:0.4+Math.random()*1.2,a:big?0.035+Math.random()*0.04:0.25+Math.random()*0.55,big})}}
function fxTint(){const g=S.screen==='home'?homeList()[S.htab==='apps'?S.asel:S.sel]:null;FX.tint=g?[150+hue(g.t)%80,170,255-hue(g.t)%60]:[120,170,255]}
function fxFrame(t){
 FX.raf=requestAnimationFrame(fxFrame);
 if(document.hidden)return;
 const dt=Math.min(0.05,(t-(FX.last||t))/1000);FX.last=t;
 fxc.clearRect(0,0,1280,720);
 const [r,g,b]=FX.tint;
 for(const p of FX.parts){
  p.x+=p.vx*dt+Math.sin(t/1000*p.sp+p.ph)*0.15;p.y+=p.vy*dt;
  if(p.y<-60){p.y=760;p.x=Math.random()*1280}if(p.x>1340){p.x=-60}
  const tw=p.big?1:0.55+0.45*Math.sin(t/1000*p.sp*2+p.ph);
  const grd=fxc.createRadialGradient(p.x,p.y,0,p.x,p.y,p.big?p.r:p.r*4);
  grd.addColorStop(0,`rgba(${r},${g},${b},${p.a*tw})`);grd.addColorStop(p.big?0.6:0.3,`rgba(${r},${g},${b},${p.a*tw*(p.big?0.5:0.35)})`);grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
  fxc.fillStyle=grd;fxc.beginPath();fxc.arc(p.x,p.y,p.big?p.r:p.r*4,0,6.283);fxc.fill();
 }
}
function fxApply(){
 if(!fxc)return;
 const want=PREF.particles!==false&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&['home','library','settings','closed'].includes(S.screen);
 fx.style.display=want?'block':'none';
 if(want&&!FX.on){FX.on=true;fxSize();if(!FX.parts.length)fxSeed();FX.last=0;FX.raf=requestAnimationFrame(fxFrame)}
 if(!want&&FX.on){FX.on=false;cancelAnimationFrame(FX.raf);fxc.clearRect(0,0,1280,720)}
 if(want)fxTint();
}
addEventListener('resize',()=>{if(FX.on)fxSize()});

/* ---- Wi-Fi and Bluetooth ---- */
function openConn(){S.conn={tab:'wifi',i:0,wifi:[],bt:[],radio:{},busy:'Loading…'};render();refreshConn(false)}
async function refreshConn(scan){
 const c=S.conn;if(!c)return;
 if(!NATIVE){c.radio={wifi:true,bluetooth:true};c.wifi=[{ssid:'Home WiFi 5G',signal:92,secure:true,connected:true,saved:true,kind:'wpa2'},{ssid:'Neighbour',signal:40,secure:true,connected:false,saved:false,kind:'wpa2'},{ssid:'Cafe Free',signal:55,secure:false,connected:false,saved:false,kind:'open'}];c.bt=[{name:'Wireless headphones',address:'00:11:22:33:44:55',connected:true,paired:true,kind:'audio'},{name:'Controller',address:'66:77:88:99:AA:BB',connected:false,paired:true,kind:'input'}];c.busy='';render();return}
 const tab=c.tab;
 c.busy=scan?(tab==='wifi'?'Looking for networks…':'Searching for devices (about 8 seconds)…'):'Loading…';render();
 const [radio,list]=await Promise.all([invoke('radio_get',{kind:tab==='wifi'?'wifi':'bluetooth'}),tab==='wifi'?invoke('wifi_list',{scan}):invoke('bt_list',{scan})]);
 if(!S.conn||S.conn.tab!==tab)return;
 c.radio[tab==='wifi'?'wifi':'bluetooth']=radio;c[tab]=list||[];c.busy='';render();
}
function connRows(){
 const c=S.conn,rows=[];
 if(c.tab==='wifi'){
  const on=c.radio.wifi;
  rows.push({label:'Wi-Fi',right:on===false?'Off':on===true?'On':'',toggle:on,fn:()=>setRadio('wifi',!on)});
  for(const n of c.wifi)rows.push({label:n.ssid,sub:(n.connected?'Connected':n.saved?'Saved':n.secure?'Secured':'Open')+' · '+n.signal+'%',sig:n.signal,lock:n.secure,on:n.connected,fn:()=>wifiPick(n)});
  if(!c.wifi.length&&!c.busy)rows.push({label:on===false?'Turn Wi-Fi on to see networks':'No networks found yet',sub:'Press Y to search again',fn:()=>refreshConn(true)});
  rows.push({label:'Search again',fn:()=>refreshConn(true)},{label:'Open Windows Wi-Fi settings',fn:()=>openSettingsPage('ms-settings:network-wifi')});
 }else{
  const on=c.radio.bluetooth;
  rows.push({label:'Bluetooth',right:on===false?'Off':on===true?'On':'',toggle:on,fn:()=>setRadio('bluetooth',!on)});
  for(const d of c.bt)rows.push({label:d.name,sub:(d.connected?'Connected':d.paired?'Paired':'Not paired — press A to pair')+' · '+({audio:'Audio',input:'Controller / input',phone:'Phone',computer:'Computer'}[d.kind]||'Device'),on:d.connected,bt:true,fn:()=>btPick(d)});
  if(!c.bt.length&&!c.busy)rows.push({label:on===false?'Turn Bluetooth on to see devices':'No devices yet',sub:'Press Y to search for nearby devices',fn:()=>refreshConn(true)});
  rows.push({label:'Search for devices',fn:()=>refreshConn(true)},{label:'Open Windows Bluetooth settings',fn:()=>openSettingsPage('ms-settings:bluetooth')});
 }
 return rows;
}

async function setRadio(kind,on){
 if(!NATIVE){S.conn.radio[kind]=on;render();return}
 toast((kind==='wifi'?'Wi-Fi':'Bluetooth')+(on?' on…':' off…'));
 const ok=await invoke('radio_set',{kind,on});if(!ok)toast('Windows didn’t allow that change');

function wifiPick(n){

 if(!n.secure||n.saved){wifiJoin(n.ssid,null);return}
 openSheet({title:n.ssid,sub:'Enter the Wi-Fi password',input:{label:'Password',secret:true,placeholder:'Password'},items:[{label:'Connect',fn:v=>wifiJoin(n.ssid,v)},{label:'Cancel'}]});
}
async function wifiJoin(ssid,pw){

 toast('Connecting to '+ssid+'…');
 try{await window.__TAURI__.core.invoke('wifi_connect',{ssid,password:pw||null});setTimeout(()=>refreshConn(false),4000);setTimeout(()=>{const n=(S.conn&&S.conn.wifi||[]).find(x=>x.ssid===ssid);toast(n&&n.connected?'Connected to '+ssid:'Still connecting… check the password if it doesn’t connect')},6000)}
 catch(e){toast(String(e))}

function btPick(d){
 if(!d.paired){if(!NATIVE){toast('Paired');return}toast('Pairing with '+d.name+'… accept any prompt that appears');
  window.__TAURI__.core.invoke('bt_pair',{address:d.address}).then(()=>{toast('Paired with '+d.name);refreshConn(false)}).catch(e=>toast(String(e)));return}

  d.connected?{label:'Disconnect',fn:()=>invoke('bt_disconnect',{address:d.address}).then(ok=>{toast(ok?'Disconnected':'Couldn’t disconnect');setTimeout(()=>refreshConn(false),1500)})}
             :{label:'Connect',fn:()=>{toast('Connecting… turn the device on if it isn’t');invoke('bt_connect',{address:d.address}).then(ok=>{if(!ok)toast('Couldn’t connect');setTimeout(()=>refreshConn(false),3000)})}},
  {label:'Forget device',danger:true,fn:()=>invoke('bt_forget',{address:d.address}).then(ok=>{toast(ok?'Removed '+d.name:'Couldn’t remove it');refreshConn(false)})},
  {label:'Cancel'}]});
}

 el.style.display='block';const rows=connRows();c.i=Math.min(c.i,rows.length-1);

/* ---- artwork from the internet ---- */
function applyArt(g){const a=ART[gid(g)];if(!a)return;if(a.cover)g.cover=a.cover;if(a.hero)g.hero=a.hero;if(a.logo)g.logo=a.logo;if(!g.cover&&a.icon&&g.app)g.cover=a.icon}
const artQ=[];let artBusy=false;
function queueArt(list){for(const g of list){const a=ART[gid(g)];if(a&&a.done)continue;if(g.steam&&PREF.steamArt!==false&&g.cover&&g.hero&&g.logo)continue;if(!artQ.includes(g))artQ.push(g)}runArt()}
async function runArt(){
 if(artBusy||!NATIVE)return;artBusy=true;
 while(artQ.length){const g=artQ.shift();await getArt(g,false);await new Promise(r=>setTimeout(r,250))}
 artBusy=false;
}
async function getArt(g,force){
 const id=gid(g);let a=force?{}:{...(ART[id]||{})};let err='';
 if(g.steam&&PREF.steamArt!==false&&(force||!a.cover||!a.hero||!a.logo)){const s=await invoke('art_steam',{appid:g.steam});if(s)for(const k of['cover','hero','logo'])if(s[k]&&(force||!a[k]))a[k]=s[k]}
 const key=(PREF.sgdbKey||'').trim();
 if(key&&(force||!a.cover||!a.hero||!a.logo)){
  try{const s=await window.__TAURI__.core.invoke('art_sgdb',{key,name:g.orig||g.t,appid:g.steam||null});for(const k of['cover','hero','logo','icon'])if(s[k]&&(force||!a[k]))a[k]=s[k]}catch(e){err=String(e)}
 }
 a.done=true;ART[id]=a;keep('cm-art',ART);applyArt(g);
 if(S.screen==='home'||S.screen==='library')render();
 return err;
}
async function fetchArt(g,force){
 if(!NATIVE){toast('Artwork downloads in the Windows app');return}
 if(!g.steam&&!(PREF.sgdbKey||'').trim()){toast('Add a free SteamGridDB API key in Settings › Artwork first');return}
 toast('Looking for artwork…');const err=await getArt(g,force);
 const a=ART[gid(g)]||{};toast(err?err:(a.cover||a.hero||a.logo)?'Artwork updated':'No artwork found for '+g.t);
}
function artAll(){if(!NATIVE){toast('Artwork downloads in the Windows app');return}for(const g of GAMES.concat(APPS)){const a=ART[gid(g)];if(a)a.done=false}queueArt(GAMES.concat(APPS));toast('Getting artwork in the background…')}
function artClear(){for(const k in ART)delete ART[k];keep('cm-art',ART);toast('Downloaded artwork cleared');if(NATIVE)loadGames(),loadApps()}

 if(sp.stack.length)return sp.stack[sp.stack.length-1].rows;
 if(sp.tab==='next'){

 }
 if(!spHasLib()&&NATIVE)return[{kind:'action',t:spConnected()?'Reconnect Spotify':'Connect Spotify',a:'Needed once to browse your library and search',act:'spset'}];
 if(sp.tab==='lib'){if(!sp.lib){spLoadLib();return[{kind:'info',t:'Loading your library…'}]}return sp.lib}

 return[field,...(sp.res||[])];

/* ---- Spotify Web API ---- */
async function spApi(path,opt={}){
 const t=await spToken();if(!t)throw new Error('Spotify sign-in expired. Reconnect it in Settings › Music.');
 const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})}});
 if(r.status===401){SPT.exp=0;throw new Error('Spotify sign-in expired. Try again.')}
 if(r.status===204)return null;
 const j=await r.json().catch(()=>null);
 if(!r.ok){const msg=(j&&j.error&&(j.error.message||j.error.reason))||('error '+r.status);const e=new Error(r.status===403?'Spotify didn’t allow this ('+msg+'). Personal Spotify apps need Premium, and some features are limited.':msg);e.status=r.status;e.reason=j&&j.error&&j.error.reason;throw e}
 return j;
}
const pickImg=imgs=>{imgs=(imgs||[]).filter(Boolean);return imgs.length?(imgs[imgs.length-1].url||imgs[0].url):null};
const trackRow=(t,ctx,img)=>t?{kind:'track',t:t.name,a:(t.artists||[]).map(a=>a.name).join(', '),len:Math.round((t.duration_ms||0)/1000),uri:t.uri,ctx,img:img||pickImg(t.album&&t.album.images)}:null;
async function spLoadLib(){
 const sp=S.sp;if(sp.busy)return;sp.busy=true;sp.err='';renderQM();
 try{
  const [pl,al]=await Promise.all([spApi('/me/playlists?limit=50'),spApi('/me/albums?limit=50').catch(()=>({items:[]}))]);
  const rows=[{kind:'liked',t:'Liked Songs',a:'Your saved songs',bg:'linear-gradient(135deg,#4527a0,#8fd3ff)'}];
  for(const p of (pl&&pl.items)||[]){if(!p)continue;const n=(p.tracks&&p.tracks.total)??(p.items&&p.items.total);rows.push({kind:'playlist',id:p.id,uri:p.uri,t:p.name,a:'Playlist'+(n!=null?' · '+n+' songs':''),img:pickImg(p.images)})}
  for(const x of (al&&al.items)||[]){const a=x.album;if(!a)continue;rows.push({kind:'album',id:a.id,uri:a.uri,t:a.name,a:'Album · '+(a.artists||[]).map(r=>r.name).join(', '),img:pickImg(a.images)})}
  sp.lib=rows;
 }catch(e){sp.err=e.message;sp.lib=[]}
 sp.busy=false;renderQM();
}
async function spOpenList(r){
 const sp=S.sp;sp.busy=true;sp.err='';renderQM();
 try{
  let rows=[];
  if(r.kind==='liked'){const j=await spApi('/me/tracks?limit=50');const uris=[];rows=(j.items||[]).map(x=>{const t=trackRow(x.track,null);if(t)uris.push(t.uri);return t}).filter(Boolean);rows.forEach(t=>t.list=uris)}
  else if(r.kind==='album'){const j=await spApi(`/albums/${r.id}/tracks?limit=50`);rows=(j.items||[]).map(t=>trackRow(t,r.uri,r.img)).filter(Boolean)}
  else{let j;try{j=await spApi(`/playlists/${r.id}/items?limit=100`)}catch(e){if(e.status===404||e.status===400)j=await spApi(`/playlists/${r.id}/tracks?limit=100`);else throw e}
   rows=(j.items||[]).map(x=>trackRow(x.item||x.track,r.uri)).filter(Boolean)}
  sp.iBack=sp.i;sp.stack.push({title:r.t,rows:rows.length?rows:[{kind:'info',t:'Nothing here'}]});sp.i=0;
 }catch(e){sp.err=e.message}
 sp.busy=false;renderQM();
}
async function spSearch(q){
 const sp=S.sp;sp.q=q;if(!q){sp.res=[];renderQM();return}
 sp.busy=true;sp.err='';renderQM();
 try{
  const j=await spApi('/search?type=track,album,playlist&limit=8&q='+encodeURIComponent(q));
  const rows=[];
  for(const t of (j.tracks&&j.tracks.items)||[])rows.push(trackRow(t,null));
  for(const a of (j.albums&&j.albums.items)||[])if(a)rows.push({kind:'album',id:a.id,uri:a.uri,t:a.name,a:'Album · '+(a.artists||[]).map(r=>r.name).join(', '),img:pickImg(a.images)});
  for(const p of (j.playlists&&j.playlists.items)||[])if(p)rows.push({kind:'playlist',id:p.id,uri:p.uri,t:p.name,a:'Playlist'+(p.owner&&p.owner.display_name?' · '+p.owner.display_name:''),img:pickImg(p.images)});
  sp.res=rows.filter(Boolean);sp.i=sp.res.length?1:0;
 }catch(e){sp.err=e.message}
 sp.busy=false;renderQM();
}
async function spPlay(r){
 if(!NATIVE){toast('Plays through Spotify in the Windows app');return}
 const body=r.ctx?{context_uri:r.ctx,offset:{uri:r.uri}}:r.list?{uris:r.list,offset:{uri:r.uri}}:{uris:[r.uri]};
 const go=dev=>spApi('/me/player/play'+(dev?'?device_id='+encodeURIComponent(dev):''),{method:'PUT',body:JSON.stringify(body)});
 try{await go(null);toast('Playing '+r.t)}
 catch(e){
  if(e.status===404||e.reason==='NO_ACTIVE_DEVICE'){
   try{const d=await spApi('/me/player/devices');const list=(d&&d.devices)||[];const dev=list.find(x=>x.type==='Computer')||list[0];
    if(dev){await go(dev.id);toast('Playing '+r.t+' on '+dev.name)}
    else{invoke('open_url',{url:'spotify:'});toast('Opening Spotify… press A again in a few seconds')}}
   catch(e2){toast(e2.message)}
  }else toast(e.message);
 }
 setTimeout(pollMedia,800);setTimeout(()=>{qT=0;pollQueue()},1500);
}

/* ---- the playing app's own icon ---- */
async function updateSourceIcon(m){

/* ---------- artwork gallery ---------- */
const GKINDS=[['grids','Cover','cover'],['heroes','Background','hero'],['logos','Logo','logo']];
async function openGallery(g){
 const key=(PREF.sgdbKey||'').trim();
 S.gal={g,k:0,zone:'top',i:0,ti:0,matches:[],match:null,imgs:{},busy:'',err:''};render();
 if(!NATIVE){S.gal.err='The gallery works in the Windows app.';render();return}
 if(!key){S.gal.err='Add your free SteamGridDB key in Settings › Artwork to browse artwork. You can still use an image from this PC.';render();return}
 await galSearch((ART[gid(g)]||{}).q||g.orig||g.t,(ART[gid(g)]||{}).sgdb);
}
async function galSearch(q,prefer){
 const G=S.gal;if(!G)return;G.busy='Searching for “'+q+'”…';G.err='';render();
 try{G.matches=await window.__TAURI__.core.invoke('art_search',{key:PREF.sgdbKey.trim(),query:q});G.q=q}catch(e){G.err=String(e);G.matches=[]}
 G.busy='';
 const m=G.matches.find(x=>x.id===prefer)||G.matches[0];
 if(m)await galUse(m);else{G.err=G.err||'Nothing found for “'+q+'”. Try another name.';render()}
}
async function galUse(m){
 const G=S.gal;if(!G)return;G.match=m;G.imgs={};G.i=0;await galLoad();
}
async function galLoad(){
 const G=S.gal;if(!G||!G.match)return;const kind=GKINDS[G.k][0];
 if(G.imgs[kind]){render();return}
 G.busy='Loading '+GKINDS[G.k][1].toLowerCase()+'s…';render();
 try{G.imgs[kind]=await window.__TAURI__.core.invoke('art_images',{key:PREF.sgdbKey.trim(),id:G.match.id,kind})}catch(e){G.err=String(e);G.imgs[kind]=[]}
 G.busy='';render();
}
const galTop=()=>[['match','Change match'],['search','Search another name'],['local','Use an image from this PC'],['reset','Reset to automatic'],['close','Done']];
function galSet(field,url){
 const G=S.gal,g=G.g,id=gid(g),a={...(ART[id]||{})};a[field]=url;a.done=true;a.manual=true;if(G.match){a.sgdb=G.match.id;a.q=G.q}ART[id]=a;keep('cm-art',ART);g[field]=url;
 toast(GKINDS.find(k=>k[2]===field)[1]+' updated');render();
}
async function galTopAct(k){
 const G=S.gal;
 if(k==='close'){S.gal=null;render();return}
 if(k==='match'){if(!G.matches.length){toast('Search for a name first');return}openSheet({title:'Which game is it?',sub:'Matches on SteamGridDB',items:G.matches.map(m=>({label:m.name+(m.year&&!m.name.includes(String(m.year))?' ('+m.year+')':''),fn:()=>galUse(m)})).concat([{label:'Cancel'}])});return}
 if(k==='search'){openSheet({title:'Search another name',sub:'Try the full title, e.g. “Marvel’s Spider-Man 2”',input:{label:'Name',value:G.q||G.g.orig||G.g.t},items:[{label:'Search',fn:v=>{if(v)galSearch(v)}},{label:'Cancel'}]});return}
 if(k==='local'){if(!NATIVE)return;const p=await invoke('pick_image');if(p)galSet(GKINDS[G.k][2],fsrc(p));return}
 if(k==='reset'){delete ART[gid(G.g)];keep('cm-art',ART);toast('Artwork reset');S.gal=null;if(NATIVE){loadGames();loadApps()}render()}
}
function renderGal(){
 const el=$('#gal'),G=S.gal;if(!G){el.style.display='none';el.innerHTML='';return}
 el.style.display='block';const kind=GKINDS[G.k],imgs=(G.imgs[kind[0]]||[]),cols=kind[0]==='grids'?6:3;
 G.i=Math.min(G.i,Math.max(0,imgs.length-1));
 const start=Math.max(0,Math.floor(G.i/cols)*cols-cols),vis=imgs.slice(start,start+cols*3);
 const cur=G.g[kind[2]];
 el.innerHTML=`<div style="position:absolute;inset:0;background:#070b16;padding:26px 48px;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;justify-content:space-between;align-items:center"><div><div class="h" style="font-size:26px;font-weight:700">Artwork · ${esc(G.g.t)}</div><div class="muted" style="font-size:13px">${G.match?'Showing SteamGridDB results for “'+esc(G.match.name)+'”':'No match selected'}${G.busy?' · '+esc(G.busy):''}</div></div>
   <div style="display:flex;gap:8px">${galTop().map(([k,l],i)=>`<button class="btn ${G.zone==='top'&&G.ti===i?'sf':''}" data-act="galtop:${k}">${l}</button>`).join('')}</div></div>
  <div class="tabs">${GKINDS.map((k,i)=>`<button class="tab ${G.k===i?'on':''}" data-act="galk:${i}">${k[1]}</button>`).join('')}<span class="muted" style="font-size:12px;align-self:center;margin-left:12px">Current: ${cur?'set':'none'}</span></div>
  ${G.err?`<p style="margin:0;color:#ff9a8a;font-size:14px">${esc(G.err)}</p>`:''}
  <div style="display:grid;grid-template-columns:repeat(${cols},minmax(0,1fr));gap:14px;flex:1;align-content:start;overflow:hidden">${vis.map((im,j)=>{const i=start+j;return `<button class="gimg ${G.zone==='grid'&&G.i===i?'sf':''} ${im.url===cur?'cur':''}" data-act="galimg:${i}" style="aspect-ratio:${kind[0]==='grids'?'2/3':kind[0]==='heroes'?'96/31':'2/1'};background:${kind[0]==='logos'?'#1a2238':'#141b2e'} url('${esc(im.thumb)}') center/${kind[0]==='logos'?'contain':'cover'} no-repeat"></button>`}).join('')}${!imgs.length&&!G.busy&&G.match?'<p class="muted">No images of this kind.</p>':''}</div>
  <div class="hint"><span><b>LB</b><b>RB</b>Cover / Background / Logo</span><span><b>A</b>Use this</span><span><b>↑</b>Buttons</span><span><b>B</b>Done</span></div></div>`;
}
function galBtn(b){
 const G=S.gal,imgs=G.imgs[GKINDS[G.k][0]]||[],cols=GKINDS[G.k][0]==='grids'?6:3;
 if(b==='B'){S.gal=null;render();return}
 if(b==='LB'||b==='RB'){G.k=(G.k+(b==='RB'?1:2))%3;G.i=0;galLoad();return}
 if(G.zone==='top'){
  if(b==='Left')G.ti=Math.max(0,G.ti-1);else if(b==='Right')G.ti=Math.min(galTop().length-1,G.ti+1);
  else if(b==='Down'&&imgs.length)G.zone='grid';else if(b==='A'){galTopAct(galTop()[G.ti][0]);return}
 }else{
  if(b==='Left')G.i=Math.max(0,G.i-1);else if(b==='Right')G.i=Math.min(imgs.length-1,G.i+1);
  else if(b==='Up'){if(G.i<cols)G.zone='top';else G.i-=cols}else if(b==='Down')G.i=Math.min(imgs.length-1,G.i+cols);
  else if(b==='A'){const im=imgs[G.i];if(im)galSet(GKINDS[G.k][2],im.url);return}
 }
 render();
}

/* ---------- controller test and extra buttons ---------- */
const XNAMES=[[0x1000,'A'],[0x2000,'B'],[0x4000,'X'],[0x8000,'Y'],[0x0100,'LB'],[0x0200,'RB'],[0x0020,'View'],[0x0010,'Menu'],[0x0040,'L3'],[0x0080,'R3'],[0x0001,'Up'],[0x0002,'Down'],[0x0004,'Left'],[0x0008,'Right'],[0x0400,'Guide'],[0x0800,'Unknown 0x0800']];
const ACTIONS=[['switcher','App switcher'],['screenshot','Screenshot'],['record','Record clip (Game Bar)'],['quickmenu','Quick menu'],['home','Console home'],['desktop','Show desktop'],['keyboard','On-screen keyboard'],['playpause','Play / pause music'],['mute','Mute']];
let ctlT;
function openCtl(){S.ctl={i:0,listen:0,data:null,seen:{},log:[]};render();clearInterval(ctlT);ctlT=setInterval(pollCtl,80)}
function closeCtl(){clearInterval(ctlT);S.ctl=null;render()}
async function pollCtl(){
 const C=S.ctl;if(!C){clearInterval(ctlT);return}
 const d=NATIVE?await invoke('controller_debug'):{xinput:null,raw:[]};if(!S.ctl)return;
 const prev=C.data;C.data=d;
 (d.raw||[]).forEach((p,pi)=>p.buttons.forEach((on,bi)=>{const was=prev&&prev.raw&&prev.raw[pi]&&prev.raw[pi].buttons[bi];if(on&&!was){C.seen[pi+':'+bi]=1;C.log.unshift(`${p.name||'Controller'}: raw button ${bi}`);C.log=C.log.slice(0,6);
  if(C.listen&&pi===0&&Date.now()>C.listenAt){const slot=C.listen;C.listen=0;pickAction(slot,bi)}}}));
 const x=d.xinput,px=prev&&prev.xinput;if(x&&px){for(const [mask,name] of XNAMES)if((x.buttons&mask)&&!(px.buttons&mask)){C.log.unshift('Xbox: '+name);C.log=C.log.slice(0,6)}}
 renderCtl();
}
function pickAction(slot,idx){
 openSheet({title:'Extra button '+slot,sub:'Raw button '+idx+' — what should it do?',items:ACTIONS.map(([k,l])=>({label:l,fn:()=>{const ex=(PREF.extra||[]).filter(e=>e.slot!==slot&&e.idx!==idx);ex.push({slot,idx,action:k});PREF.extra=ex;savePref();pushExtra();toast('Extra button '+slot+': '+l)}})).concat([{label:'Cancel'}])});
}
function pushExtra(){invoke('set_extra_buttons',{map:(PREF.extra||[]).map(e=>[e.idx,e.action])})}
const ctlRows=()=>[['assign1','Assign extra button 1'],['assign2','Assign extra button 2'],['clear','Clear extra buttons'],['close','Close']];
function ctlAct(k){
 const C=S.ctl;
 if(k==='close'){closeCtl();return}
 if(k==='clear'){PREF.extra=[];savePref();pushExtra();toast('Extra buttons cleared');renderCtl();return}
 C.listen=k==='assign1'?1:2;C.listenAt=Date.now()+700;renderCtl();
}
function renderCtl(){
 const el=$('#ctl'),C=S.ctl;if(!C){el.style.display='none';el.innerHTML='';return}
 el.style.display='block';const d=C.data||{},x=d.xinput;
 const chip=(on,l)=>`<span style="padding:6px 10px;border-radius:14px;font-size:12px;font-weight:600;background:${on?'#5B9BFF':'rgba(255,255,255,.08)'};color:${on?'#05070d':'#c9d2e6'}">${esc(l)}</span>`;
 const maps=(PREF.extra||[]).map(e=>'Extra button '+e.slot+' (raw '+e.idx+'): '+((ACTIONS.find(a=>a[0]===e.action)||[])[1]||e.action)).join(' · ')||'No extra buttons set';
 el.innerHTML=`<div style="position:absolute;inset:0;background:#070b16;padding:28px 48px;display:flex;gap:36px">
  <div style="flex:1;display:flex;flex-direction:column;gap:14px;min-width:0">
   <div class="h" style="font-size:26px;font-weight:700">Controller test</div>
   <p class="muted" style="margin:0;font-size:14px">Press any button and watch what lights up. If your extra buttons light up anything under “Raw buttons”, they can be assigned.</p>
   <div class="gl" style="margin:6px 0 0">Xbox controller interface ${x?'(slot '+x.slot+')':'— no controller'}</div>
   <div style="display:flex;flex-wrap:wrap;gap:6px">${XNAMES.map(([m,n])=>chip(x&&(x.buttons&m),n)).join('')}${chip(x&&x.lt>100,'LT')}${chip(x&&x.rt>100,'RT')}</div>
   ${(d.raw||[]).map((p,pi)=>`<div class="gl" style="margin:8px 0 0">Raw buttons · ${esc(p.name||'Controller')} (VID ${p.vid.toString(16)}, PID ${p.pid.toString(16)}) · ${p.buttons.length} buttons</div><div style="display:flex;flex-wrap:wrap;gap:6px">${p.buttons.map((on,bi)=>chip(on,String(bi)+(C.seen[pi+':'+bi]?'·':''))).join('')}${(p.switches||[]).map((v,si)=>chip(v!==0,'Hat '+si+': '+v)).join('')}</div>`).join('')||'<div class="gl" style="margin:8px 0 0">Raw buttons · nothing found through this interface</div>'}
   <div class="gl" style="margin:8px 0 0">Last presses</div><div style="font-size:13px;color:#c9d2e6;line-height:1.6">${C.log.map(esc).join('<br>')||'—'}</div>
  </div>
  <div style="width:340px;display:flex;flex-direction:column;gap:8px">
   ${C.listen?`<div style="padding:14px;border-radius:12px;background:rgba(91,155,255,.2);font-size:14px">Press the extra button you want to use as button ${C.listen} now…</div>`:''}
   ${ctlRows().map(([k,l],i)=>`<button class="btn ${C.i===i?'sf':''}" style="text-align:left;border-radius:12px;height:48px" data-act="ctlrow:${k}">${l}</button>`).join('')}
   <p class="muted" style="font-size:13px;line-height:1.5">${esc(maps)}</p>
   <div class="hint" style="font-size:12px"><span><b>↑↓</b>Move</span><span><b>A</b>Select</span><span><b>B</b>Close</span></div>
  </div></div>`;
}
function ctlBtn(b){
 const C=S.ctl;if(C.listen)return;
 if(b==='B'){closeCtl();return}
 if(b==='Up')C.i=Math.max(0,C.i-1);else if(b==='Down')C.i=Math.min(ctlRows().length-1,C.i+1);else if(b==='A'){ctlAct(ctlRows()[C.i][0]);return}
 renderCtl();
}

/* ---------- updates ---------- */
async function updCheck(){
 if(!NATIVE){S.upd={err:'Updates work in the Windows app'};render();return}
 S.upd={busy:'Checking…'};render();
 try{const r=await window.__TAURI__.core.invoke('update_check');S.upd=r;toast(r.newer?'A new version is available':'You have the newest version')}catch(e){S.upd={err:String(e)}}
 render();
}
async function updInstall(){
 const u=S.upd;if(!u||!u.latest)return;S.upd={...u,busy:'Downloading…',pct:0};render();
 try{await window.__TAURI__.core.invoke('update_install',{url:u.latest.url})}catch(e){S.upd={...u,err:String(e),busy:''};render()}
}

/* ---------- web apps ---------- */
let WEBAPPS=store('cm-webapps',[]);
const hostOf=u=>{try{return new URL(u.includes('://')?u:'https://'+u).hostname.replace(/^www\./,'')}catch(e){return u}};
function addWebApp(){
 openSheet({title:'Add a web app',sub:'Any website, opened full screen in its own window',input:{label:'Website address',placeholder:'e.g. youtube.com or hotstar.com'},items:[
  {label:'Next',fn:url=>{if(!url){toast('Type a website address');return}const h=hostOf(url);const nice=h.split('.')[0];
   openSheet({title:'Name it',sub:h,input:{label:'Name',value:nice.charAt(0).toUpperCase()+nice.slice(1)},items:[
    {label:'Add',fn:name=>{const u=url.includes('://')?url:'https://'+url;const id='web:'+u.toLowerCase();if(WEBAPPS.some(w=>w.id===id)){toast('Already added');return}WEBAPPS.push({id,name:name||h,url:u});keep('cm-webapps',WEBAPPS);toast('Added '+(name||h));S.htab='apps';if(NATIVE)loadApps();else render()}},{label:'Cancel'}]})}},
  {label:'Cancel'}]});
}
function webAppItems(){return WEBAPPS.map(w=>{const [c1,c2]=colors(w.name);return{id:w.id,orig:w.name,t:NAMES[w.id]||w.name,s:'Web app · '+hostOf(w.url),last:ago(PLAYED[w.id]||0),ts:PLAYED[w.id]||0,lp:PLAYED[w.id]?-PLAYED[w.id]:1e12,inst:'',app:true,web:true,c1,c2,tags:FAV[w.id]?['fav']:[],kind:'webapp',target:w.url,icon:`https://www.google.com/s2/favicons?domain=${encodeURIComponent(hostOf(w.url))}&sz=256`}})}
const ICONS=store('cm-icons',{});
async function loadAppIcons(){
 if(!NATIVE)return;
 for(const a of APPS){if(a.kind!=='appid'||a.icon)continue;if(ICONS[a.id]){a.icon=ICONS[a.id];continue}
  const i=await invoke('app_icon',{appId:a.target});if(i){a.icon=i;ICONS[a.id]=i;keep('cm-icons',ICONS)}}
 if(S.screen==='home')render();
}

if(NATIVE){
 const ev=window.__TAURI__.event;
 ev.listen('pad',e=>handle(e.payload));
 ev.listen('guide',()=>{if(S.osk.open)closeOsk();if(S.screen==='settings'&&S.set.listen)return;S.sheet=null;S.conn=null;
  if(S.qm.open){S.qm.open=false;render();invoke('resume_game');return}
  S.qm.open=true;S.qm.row=0;S.qm.col=0;S.qm.side=false;pollMedia();pollVolume();render()});
 ev.listen('home',()=>{S.qm.open=false;go('home')});
 ev.listen('game_ended',()=>{if(S.game&&!S.game.app){S.game=null;render()}});
 ev.listen('padstatus',e=>{S.pad=e.payload?'Xbox-style controller':'';if(S.screen==='home')render()});
 ev.listen('spotify_code',e=>spFinish(e.payload||{}));
 ev.listen('update-progress',e=>{const p=e.payload||{};if(S.upd){S.upd.pct=p.total?p.done/p.total*100:null;S.upd.busy=p.total&&p.done>=p.total?'Installing… Console Mode will reopen':'Downloading…';if(S.screen==='settings')render()}});
 invoke('app_build').then(b=>{S.build=b});pushExtra();
 document.addEventListener('mousemove',e=>{S.ct=Date.now();S.mx=e.clientX;S.my=e.clientY;hover()});
 $('#cur').style.display='none';$('#chip').style.display='none';
 TABS=[['All games',()=>true],['Favourites',g=>!!FAV[g.id]],['Steam',g=>g.s==='Steam'],['Epic',g=>g.s==='Epic'],['GOG',g=>g.s==='GOG'],['Added',g=>g.s==='Added'],['Never played',g=>!g.ts]];
 GAMES.length=0;APPS.length=0;
 loadGames();loadDisplay();pushCursor();invoke('set_home_screen',{on:PREF.homeScreen!==false});
 setTimeout(loadApps,1500);
 invoke('autostart_get').then(v=>{if(v!=null){PREF.startup=v;savePref()}});
 setInterval(()=>{if(S.screen==='settings'&&SECS[S.set.sec][1]==='power')pollStats()},1000);
 setInterval(()=>{if(S.qm.open||S.screen==='home')pollMedia()},2500);
 setInterval(()=>{if(S.qm.open)pollVolume()},4000);
 setTimeout(pollMedia,800);setTimeout(pollVolume,1000);
}else{S.volume=S.vol}

/* ---------- timers, scaling ---------- */
setInterval(()=>{
 document.querySelectorAll('.clk').forEach(e=>e.textContent=clock());
 if(!NATIVE&&S.playing){S.pos++;if(S.pos>=track(S.mi).len){S.mi++;S.pos=0}}
 tickProgress();
 tickStats();if(S.qm.open)renderQM();if(S.screen==='settings'&&SECS[S.set.sec][1]==='power'&&!S.set.confirm)render();
 const gt=$('#gt');if(gt&&S.game)gt.textContent=mmss(Math.floor((Date.now()-S.gameStart)/1000));
},1000);
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();if(!NATIVE)applyBright();
document.querySelectorAll('.clk').forEach(e=>e.textContent=clock());
render();
}
