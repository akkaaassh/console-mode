<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keyboard</title>
<style>
/* The desktop keyboard: a separate window that never takes focus, so keys go to the app underneath. */
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#080c16;color:#eef2fb;font:15px Inter,system-ui,sans-serif;overflow:hidden;user-select:none}
#kb{height:100%;display:flex;flex-direction:column;gap:1.4vh;padding:2vh 6vw 1.6vh;border-top:1px solid rgba(255,255,255,.12)}
.row{flex:1;display:flex;gap:.6vw;min-height:0}
.k{position:relative;flex:1 1 0;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.07);color:inherit;font:500 clamp(14px,3.4vh,28px) Inter,system-ui,sans-serif;cursor:pointer}
.k.sp{background:rgba(255,255,255,.14);font-size:clamp(12px,2.4vh,18px);font-weight:600}
.k.on{background:#fff;color:#05070d;box-shadow:0 0 0 3px #5B9BFF}
.k.lit{background:#5B9BFF;color:#05070d}
.k span{position:absolute;right:7px;bottom:4px;font-size:clamp(9px,1.5vh,12px);font-weight:600;color:#8fa0c0}
.k.on span{color:#45506a}
.hint{display:flex;justify-content:center;gap:2.2vw;font-size:clamp(11px,1.7vh,14px);color:#a9b4cc;flex-wrap:wrap}
.hint b{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;border:1.5px solid #a9b4cc;color:#eef2fb;font-size:10px;margin-right:5px}
</style>
</head>
<body>
<div id="kb" role="group" aria-label="On-screen keyboard"></div>
<script>
{
const T=window.__TAURI__;
const send=key=>T&&T.core.invoke('osk_key',{key});
const hide=()=>T&&T.core.invoke('osk_hide');
const LETTERS=[['1','2','3','4','5','6','7','8','9','0','⌫'],['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l','Enter'],['Shift','z','x','c','v','b','n','m',',','.'],['#+=','@','Space','.com','←','→','Hide']];
const SYMBOLS=[['1','2','3','4','5','6','7','8','9','0','⌫'],['!','?','&','%','$','#','*','(',')','"'],['-','_','=','+',':',';','/','\\','\'','Enter'],['ABC','<','>','[',']','{','}','|','~','^'],['ABC','@','Space','.com','←','→','Hide']];
const WIDE={'⌫':1.5,'Enter':1.6,'Shift':1.6,'ABC':1.6,'#+=':1.4,'Space':5,'.com':1.3,'Hide':1.3};
const HINT={'⌫':'B','Shift':'X','Space':'Y','Enter':'Menu','Hide':'View','←':'LB','→':'RB'};
const st={r:2,c:4,shift:false,sym:false};
const rows=()=>st.sym?SYMBOLS:LETTERS;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){
 const R=rows();st.r=Math.min(st.r,R.length-1);st.c=Math.min(st.c,R[st.r].length-1);
 document.getElementById('kb').innerHTML=R.map((row,ri)=>`<div class="row">${row.map((k,ci)=>{
  const sp=k.length>1||'⌫←→'.includes(k);const lab=!sp&&st.shift?k.toUpperCase():k;
  return `<button class="k ${sp?'sp':''} ${ri===st.r&&ci===st.c?'on':''} ${(k==='Shift'&&st.shift)?'lit':''}" style="flex:${WIDE[k]||1} 1 0" data-r="${ri}" data-c="${ci}" aria-label="${esc(k)}">${esc(lab)}<span>${HINT[k]||''}</span></button>`}).join('')}</div>`).join('')+
  `<div class="hint"><span><b>A</b>Key</span><span><b>B</b>Backspace</span><span><b>X</b>Shift</span><span><b>Y</b>Space</span><span><b>LB</b><b>RB</b>Move cursor</span><span><b>Menu</b>Enter</span><span><b>View</b>Close</span><span><b>RS</b>Mouse</span></div>`;
}
function press(k){
 if(k==='Hide'){hide();return}
 if(k==='Shift'){st.shift=!st.shift;draw();return}
 if(k==='#+='){st.sym=true;draw();return}
 if(k==='ABC'){st.sym=false;draw();return}
 if(k==='⌫'){send('Backspace');return}
 if(k==='Enter'){send('Enter');return}
 if(k==='←'){send('Left');return}
 if(k==='→'){send('Right');return}
 if(k==='Space'){send(' ');return}
 if(k==='.com'){send('.com');return}
 send(st.shift?k.toUpperCase():k);
 if(st.shift){st.shift=false;draw()}
}
function pad(b){
 const R=rows();
 if(b==='Up'){st.r=Math.max(0,st.r-1);st.c=Math.min(st.c,R[st.r].length-1)}
 else if(b==='Down'){st.r=Math.min(R.length-1,st.r+1);st.c=Math.min(st.c,R[st.r].length-1)}
 else if(b==='Left')st.c=Math.max(0,st.c-1);
 else if(b==='Right')st.c=Math.min(R[st.r].length-1,st.c+1);
 else if(b==='A'){press(R[st.r][st.c]);return}
 else if(b==='B'){send('Backspace');return}
 else if(b==='X'){press('Shift');return}
 else if(b==='Y'){send(' ');return}
 else if(b==='LB'){send('Left');return}
 else if(b==='RB'){send('Right');return}
 else if(b==='Menu'){send('Enter');return}
 else if(b==='View'||b==='Guide'){hide();return}
 else return;
 draw();
}
document.addEventListener('mousedown',e=>{e.preventDefault();const b=e.target.closest('.k');if(!b)return;st.r=+b.dataset.r;st.c=+b.dataset.c;press(rows()[st.r][st.c]);draw()});
if(T){T.event.listen('osk-pad',e=>pad(e.payload));T.event.listen('osk-open',()=>{st.shift=false;draw()})}
draw();
}
</script>
</body>
</html>
